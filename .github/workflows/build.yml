name: Build Harf IPA

on:
  push:
    branches: [harf-keyboard, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          status=0
          xcodebuild \
            -project Harf.xcodeproj \
            -scheme Harf \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || status=$?
          grep -E "(error|warning):" build.log | grep -v "^ld: warning" | sort -u > diagnostics.txt || true
          echo "::group::Errors"
          grep "error:" diagnostics.txt | head -80 || true
          echo "::endgroup::"
          if [ "$status" != "0" ]; then tail -150 build.log; exit 1; fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Harf.app Payload/
          ls -la Payload/Harf.app/PlugIns
          plutil -p Payload/Harf.app/PlugIns/HarfKeyboard.appex/Info.plist
          zip -qry Harf.ipa Payload

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: harf-build-${{ github.run_number }}
          name: Harf build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            Harf.ipa
            diagnostics.txt
          prerelease: true
          make_latest: false

      - name: Publish build log (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: harf-log-${{ github.run_number }}
          name: Harf build log ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            build.log
            diagnostics.txt
          prerelease: true
          make_latest: false
