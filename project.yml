name: Harf
options:
  bundleIdPrefix: com.fezo
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "6"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  Harf:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fezo.harf
        INFOPLIST_FILE: Support/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HarfKeyboard
  HarfKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fezo.harf.keyboard
        INFOPLIST_FILE: Support/Keyboard-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Harf:
    build:
      targets:
        Harf: all
        HarfKeyboard: all
